// Контакт пользователя: куда писать, когда ему нужно что-то сообщить.
//
// Адрес электронной почты принадлежит пользователю, а не заказу, поэтому хранит и отдаёт его
// тот, кто владеет пользователями, — identity-service. Сервис уведомлений знает получателя
// только по номеру (в событии заказа адреса нет и быть не должно: событие читают многие
// потребители, а адрес — персональные данные) и спрашивает контакт в момент отправки.
//
// Отдаётся минимум: адрес, имя для обращения и признак «включён». Пароль, телефон, роли и
// всё прочее сюда не попадают — расширять сообщение стоит только под конкретного потребителя
// с конкретной причиной.
syntax = "proto3";

package fooddelivery.identity.v1;

option java_multiple_files = true;
option java_package = "com.dima.fooddelivery.grpc.identity.v1";
option java_outer_classname = "UserDirectoryProto";

service UserDirectoryService {
  // Контакт пользователя по номеру. Неизвестный пользователь — NOT_FOUND: это не сбой, а
  // нормальный ответ, например для пользователя, которого успели удалить, пока событие
  // шло по очереди.
  rpc GetUserContact(GetUserContactRequest) returns (UserContact);
}

message GetUserContactRequest {
  int64 user_id = 1;
}

message UserContact {
  int64 user_id = 1;
  string email = 2;
  // Как обратиться к человеку в письме; может быть пустым.
  string full_name = 3;
  // false — пользователь заблокирован администратором. Решать, писать ли ему, должен
  // потребитель: для одних уведомлений блокировка важна, для других нет.
  bool enabled = 4;
}
