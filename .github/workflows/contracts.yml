name: Publish

# Публикация контрактов в GitHub Packages — по тегу вида v1.2.0.
#
# Версия контрактов своя, отдельная от версий сервисов: на них завязаны все сервисы сразу.
# Совместимое изменение (новое поле, новый метод) — минорная версия. Несовместимое — мажорная
# и новый пакет .proto (catalog.v2), а старый живёт рядом, пока его не перестанут использовать.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Публикация контрактов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # server-id совпадает с id репозитория в distributionManagement: setup-java пишет
      # settings.xml с этим сервером и токеном из окружения.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Версия из тега
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Библиотеки контрактов без родителя, клиент — с родителем-агрегатором: версия
      # выставляется всем разом, включая родителя.
      - name: Выставить версию
        run: |
          ./mvnw -B --no-transfer-progress versions:set \
            -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Опубликовать
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B --no-transfer-progress deploy
